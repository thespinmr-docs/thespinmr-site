<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thespinMR Studio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://thespinmr-docs.github.io/thespinmr-site/assets/img/favicon-32.png">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#121212; color:#E0E0E0; font:16px/1.6 system-ui,'Segoe UI',Arial,sans-serif; text-align:center; padding:24px; }
    h1 { color:#fff; margin:0 0 .5rem; font-size:2rem; }
    a { display:inline-block; margin-top:1rem; background:#00DE8C; color:#04110B; text-decoration:none; font-weight:600; padding:.7rem 1.3rem; border-radius:10px; }
  </style>
</head>
<body><main>
  <h1 id="t">Page introuvable</h1>
  <p id="p">Cette page n'existe pas ou a été déplacée.</p>
  <a id="a" href="https://thespinmr-docs.github.io/thespinmr-site/">Retour à l'accueil</a>
</main>
<script>
  (function () {
    var L = {
      en: ['Page not found', 'This page does not exist or has been moved.', 'Back to home', 'en/'],
      es: ['Página no encontrada', 'Esta página no existe o se ha movido.', 'Volver al inicio', 'es/'],
      de: ['Seite nicht gefunden', 'Diese Seite existiert nicht oder wurde verschoben.', 'Zur Startseite', 'de/'],
      it: ['Pagina non trovata', 'Questa pagina non esiste o è stata spostata.', 'Torna alla home', 'it/']
    };
    var n = (navigator.language || 'fr').slice(0, 2).toLowerCase(), v = L[n];
    if (!v) return;
    document.documentElement.lang = n;
    document.getElementById('t').textContent = v[0];
    document.getElementById('p').textContent = v[1];
    var a = document.getElementById('a'); a.textContent = v[2]; a.href = 'https://thespinmr-docs.github.io/thespinmr-site/' + v[3];
  })();
</script>
</body>
</html>
